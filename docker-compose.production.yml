services:
  backend:
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JOB_EXECUTION_MODE: queue
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["${PUBLIC_ORIGIN}"]'
      ALLOWED_HOSTS: '["${PUBLIC_HOST}","backend"]'
      COOKIE_SECURE: "true"
      FORCE_HTTPS: "true"
      ALLOW_PRIVATE_PROXY_HOSTS: "false"
    volumes: []
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./BE
    env_file:
      - ./BE/.env
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JOB_EXECUTION_MODE: queue
      REDIS_URL: redis://redis:6379/0
      GROK2API_BASE_URL: http://grok2api:8000
      GROK2API_API_KEY: ${GROK2API_API_KEY}
      GROK2API_ADMIN_USERNAME: ${GROK2API_ADMIN_USERNAME:-admin}
      GROK2API_ADMIN_PASSWORD: ${GROK2API_ADMIN_PASSWORD}
      COOKIE_SECURE: "true"
      FORCE_HTTPS: "true"
      ALLOW_PRIVATE_PROXY_HOSTS: "false"
      XAI_API_KEY: ${XAI_API_KEY:-}
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grok2api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  redis-data:
