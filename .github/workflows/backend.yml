name: Backend

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: BE/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r BE/requirements.txt
      - run: python -m pytest -q
        working-directory: BE
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-at-least-32-characters

  migration-check:
    name: Database migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BE/requirements.txt
      - run: pip install -r BE/requirements.txt
      - run: python -m alembic upgrade head
        working-directory: BE
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-at-least-32-characters
          DATABASE_URL: sqlite:///./ci-migrations.db

  compile-check:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q BE/app BE/migrations
