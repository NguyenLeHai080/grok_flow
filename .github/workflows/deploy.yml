name: Deploy

on:
  push:
    branches: [staging, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CD_ENABLED == 'true'
    name: Deploy selected environment
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'prod' && 'production' || 'staging') }}
    steps:
      - name: Resolve branch
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$REQUESTED_ENVIRONMENT" = "production" ] && branch=prod || branch=staging
          else
            branch="$PUSH_BRANCH"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy exact branch revision
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          printf -v remote_command 'set -euo pipefail; cd %q; git fetch --prune origin; git checkout %q; git reset --hard origin/%q; docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build --remove-orphans; docker compose -f docker-compose.yml -f docker-compose.production.yml ps' "$DEPLOY_PATH" "$DEPLOY_BRANCH" "$DEPLOY_BRANCH"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
