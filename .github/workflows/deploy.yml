name: Deploy

on:
  push:
    branches: [staging, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name == 'push' && github.ref_name == 'staging' && vars.STAGING_CD_ENABLED == 'true') ||
      (github.event_name == 'push' && github.ref_name == 'prod' && vars.PRODUCTION_CD_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && vars.STAGING_CD_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && vars.PRODUCTION_CD_ENABLED == 'true')
    name: Deploy selected environment
    runs-on: [self-hosted, linux, x64, groks-server]
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'prod' && 'production' || 'staging') }}
    steps:
      - name: Resolve branch
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$REQUESTED_ENVIRONMENT" = "production" ] && branch=prod || branch=staging
          else
            branch="$PUSH_BRANCH"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Deploy exact branch revision locally
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PROJECT_NAME: ${{ secrets.DEPLOY_PROJECT_NAME }}
          DEPLOY_OVERRIDE_FILE: ${{ secrets.DEPLOY_OVERRIDE_FILE }}
          DEPLOY_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          compose_files=(-f docker-compose.yml)
          if [ "$DEPLOY_BRANCH" = "prod" ]; then
            compose_files+=(-f docker-compose.production.yml)
          fi
          if [ -n "${DEPLOY_OVERRIDE_FILE:-}" ]; then
            compose_files+=(-f "$DEPLOY_OVERRIDE_FILE")
          fi
          cd "$DEPLOY_PATH"
          git fetch --prune origin
          git checkout "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          docker compose -p "$DEPLOY_PROJECT_NAME" "${compose_files[@]}" up -d --build --remove-orphans
          docker compose -p "$DEPLOY_PROJECT_NAME" "${compose_files[@]}" ps
