name: Infrastructure

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret config files
        run: |
          cp .env.example .env
          cp BE/.env.example BE/.env
          cp grok2api-main/config.example.yaml grok2api-main/config.yaml
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - name: Validate frontend Nginx configuration
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host grok2api:127.0.0.1 \
            -v "$PWD/FE/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.29-alpine nginx -t

  docker-build:
    name: Docker build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: BE
          - service: frontend
            context: FE
          - service: grok2api
            context: grok2api-main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: groks/${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
