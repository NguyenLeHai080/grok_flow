name: Governance

on:
  pull_request:
    branches: [dev, staging, prod]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/validate_commits.py "$BASE_SHA" "$HEAD_SHA"
      - name: Validate linked issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) #[1-9][0-9]*|#[1-9][0-9]*'
      - name: Manual validation notice
        if: github.event_name == 'workflow_dispatch'
        run: echo "Commit policy is evaluated on pull requests."

  pull-request-size:
    name: Pull request size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce reviewable change size
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          total=$((ADDITIONS + DELETIONS))
          echo "files=$CHANGED_FILES lines=$total"
          if [ "$CHANGED_FILES" -gt 150 ] || [ "$total" -gt 15000 ]; then
            echo "Pull request is too large for safe review; split it or document an approved exception."
            exit 1
          fi
