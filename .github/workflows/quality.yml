name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - prod
  push:
    branches:
      - dev
      - staging
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Commit policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/validate_commits.py "$BASE_SHA" "$HEAD_SHA"

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BE/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r BE/requirements.txt
      - run: python -m pytest -q
        working-directory: BE
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-at-least-32-characters

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
        working-directory: FE
      - run: npm run lint
        working-directory: FE
      - run: npm run format:check
        working-directory: FE
      - run: npm run build
        working-directory: FE

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret config files
        run: |
          cp .env.example .env
          cp BE/.env.example BE/.env
          cp grok2api-main/config.example.yaml grok2api-main/config.yaml
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
