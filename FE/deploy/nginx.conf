server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
    }

    location = /grok2api-runtime {
        return 301 /grok2api-runtime/;
    }

    location = /grok2api-runtime/runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.__GROK2API_RUNTIME_CONFIG__ = { apiBaseUrl: "/grok2api-runtime", appBasePath: "/grok2api-runtime", publicApiBaseUrl: "/grok2api-runtime" };';
    }

    location /grok2api-runtime/ {
        proxy_pass http://grok2api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_cookie_path /api/admin/v1/auth /grok2api-runtime/api/admin/v1/auth;
        proxy_cookie_flags grok2api_admin_refresh secure httponly samesite=strict;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/grok2api-runtime/';
        sub_filter 'src="/' 'src="/grok2api-runtime/';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
